name: GoreeCloud Calendar quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: calendar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m compileall -q calendar_app tests linux
      - run: python -m unittest discover -s tests -v
      - run: python -m calendar_app --help
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate local Compose configuration
        run: docker compose config --quiet
      - name: Build self-hosted service image
        run: docker build --pull -t goreecloud-calendar:ci .
      - name: Verify IANA timezone support inside container
        run: docker run --rm goreecloud-calendar:ci python -c "from zoneinfo import ZoneInfo; assert ZoneInfo('America/Chicago').key == 'America/Chicago'"
      - name: Verify server container readiness
        run: |
          docker run -d --name calendar-smoke -p 127.0.0.1:18787:8787 goreecloud-calendar:ci
          trap 'docker rm -f calendar-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18787/readyz; then
              echo "Calendar server readiness confirmed"
              exit 0
            fi
            sleep 1
          done
          docker logs calendar-smoke
          exit 1
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node --check web/app.js
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install GTK4/Xvfb dependencies with bounded APT network wait
        shell: bash
        run: |
          set -euo pipefail
          # A hosted APT DNS outage is an infrastructure failure, not a GUI pass.
          if ! sudo timeout -k 5s 180s apt-get -o Acquire::Retries=1 \
              -o APT::Update::Error-Mode=any -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update -qq; then
            echo "::error::Calendar GTK test APT index update failed; GUI smoke not executed"
            exit 1
          fi
          if ! sudo timeout -k 5s 180s apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 xvfb xauth; then
            echo "::error::Calendar GTK test dependencies unavailable; GUI smoke not executed"
            exit 1
          fi
      - name: Verify native binding imports
        run: /usr/bin/python3 -c 'import gi; gi.require_version("Gtk", "4.0"); from gi.repository import Gtk; print(Gtk.MAJOR_VERSION)'
      - name: Smoke-test GTK application under virtual display
        run: |
          set +e
          xvfb-run -a timeout 8s /usr/bin/python3 linux/calendar_gtk.py
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "GTK client failed to remain open in the virtual display (exit: $code)"
            exit 1
          fi
      - name: Exercise native login, origin safety and Calendar/Tasks pane rendering
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if ! xvfb-run -a /usr/bin/python3 linux/tests/gui_smoke.py >"$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          cat "$log"
          grep -q '^CALENDAR_GTK4_LOGIN_ORIGIN_AND_NATIVE_PANES_SMOKE_PASS$' "$log"
          if grep -E 'Gtk-WARNING|Gtk-CRITICAL|GLib-GObject-CRITICAL|Theme parser warning' "$log"; then
            echo "::error::Native GTK emitted a parser or critical warning"
            exit 1
          fi
      - name: Verify per-user launcher installer
        run: |
          temp_home="$(mktemp -d)"
          HOME="$temp_home" sh linux/install.sh
          test -f "$temp_home/.local/share/applications/com.goreecloud.Calendar.desktop"
          test -f "$temp_home/.local/share/goreecloud-calendar/calendar_gtk.py"
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-disabled: 'true'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android --no-daemon :app:assembleDebug
      - name: Confirm APK package identity and checksum
        run: |
          artifact=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$artifact"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$artifact" | grep -q "package: name='com.goreecloud.calendar'"
          sha256sum "$artifact"
      - name: Android static lint
        run: gradle -p android --no-daemon :app:lintDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: goreecloud-calendar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
